<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet</title>
<meta name="description" content="Notes, listes et dessins, partagés en PDF soignés.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#a8352b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,arrow_back,brush,check,checklist,chevron_right,close,cloud_done,content_copy,contrast,dark_mode,delete,delete_sweep,download,draw,image,ink_eraser,ink_highlighter,ink_pen,light_mode,palette,picture_as_pdf,push_pin,redo,search,settings,share,smartphone,sticky_note_2,undo,upload&display=block">
<style>
/* Layout: app-shell à une colonne (max 760px), grille maçonnée de cartes, vues plein écran pour l'édition, barres flottantes M3 Expressive. */
:root{
  --h: 27; --h3: 85;
  --primary: oklch(.50 .16 var(--h));
  --on-primary: oklch(.99 .01 var(--h));
  --primary-c: oklch(.90 .07 var(--h));
  --on-primary-c: oklch(.30 .10 var(--h));
  --secondary-c: oklch(.92 .035 var(--h));
  --on-secondary-c: oklch(.30 .04 var(--h));
  --tertiary: oklch(.56 .13 var(--h3));
  --tertiary-c: oklch(.90 .10 var(--h3));
  --on-tertiary-c: oklch(.32 .08 var(--h3));
  --bg: oklch(.985 .006 var(--h));
  --s1: oklch(.968 .010 var(--h));
  --s2: oklch(.952 .013 var(--h));
  --s3: oklch(.935 .016 var(--h));
  --s4: oklch(.912 .019 var(--h));
  --fg: oklch(.22 .02 var(--h));
  --fg2: oklch(.44 .025 var(--h));
  --outline: oklch(.66 .02 var(--h));
  --outline-v: oklch(.86 .015 var(--h));
  --scrim: oklch(.15 .02 var(--h) / .42);
  --inverse: oklch(.28 .02 var(--h));
  --on-inverse: oklch(.95 .01 var(--h));
  --inverse-primary: oklch(.82 .10 var(--h));
  --danger: oklch(.52 .19 27);
  --danger-c: oklch(.92 .05 27);
  --nL: .925; --nC: .06; --nPaper: .97;
  --shadow: 0 1px 2px oklch(.2 .02 var(--h) / .12), 0 6px 18px oklch(.2 .02 var(--h) / .10);

  --f-ui: "Roboto Flex", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif: "Fraunces", Georgia, "Times New Roman", serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;

  --e-fast: cubic-bezier(.42, 1.67, .21, .90);
  --e-spatial: cubic-bezier(.38, 1.21, .22, 1.00);
  --e-effect: cubic-bezier(.31, .94, .34, 1.00);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --primary: oklch(.80 .11 var(--h)); --on-primary: oklch(.27 .09 var(--h));
    --primary-c: oklch(.37 .11 var(--h)); --on-primary-c: oklch(.92 .05 var(--h));
    --secondary-c: oklch(.33 .04 var(--h)); --on-secondary-c: oklch(.90 .03 var(--h));
    --tertiary: oklch(.82 .11 var(--h3)); --tertiary-c: oklch(.38 .09 var(--h3)); --on-tertiary-c: oklch(.92 .06 var(--h3));
    --bg: oklch(.165 .012 var(--h)); --s1: oklch(.195 .014 var(--h)); --s2: oklch(.22 .016 var(--h));
    --s3: oklch(.25 .017 var(--h)); --s4: oklch(.285 .018 var(--h));
    --fg: oklch(.93 .012 var(--h)); --fg2: oklch(.76 .02 var(--h));
    --outline: oklch(.56 .02 var(--h)); --outline-v: oklch(.35 .02 var(--h));
    --scrim: oklch(.05 .01 var(--h) / .6);
    --inverse: oklch(.90 .01 var(--h)); --on-inverse: oklch(.22 .02 var(--h)); --inverse-primary: oklch(.50 .16 var(--h));
    --danger: oklch(.76 .14 27); --danger-c: oklch(.36 .09 27);
    --nL: .30; --nC: .05; --nPaper: .25;
    --shadow: 0 1px 2px oklch(0 0 0 / .4), 0 8px 22px oklch(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"]{
  --primary: oklch(.80 .11 var(--h)); --on-primary: oklch(.27 .09 var(--h));
  --primary-c: oklch(.37 .11 var(--h)); --on-primary-c: oklch(.92 .05 var(--h));
  --secondary-c: oklch(.33 .04 var(--h)); --on-secondary-c: oklch(.90 .03 var(--h));
  --tertiary: oklch(.82 .11 var(--h3)); --tertiary-c: oklch(.38 .09 var(--h3)); --on-tertiary-c: oklch(.92 .06 var(--h3));
  --bg: oklch(.165 .012 var(--h)); --s1: oklch(.195 .014 var(--h)); --s2: oklch(.22 .016 var(--h));
  --s3: oklch(.25 .017 var(--h)); --s4: oklch(.285 .018 var(--h));
  --fg: oklch(.93 .012 var(--h)); --fg2: oklch(.76 .02 var(--h));
  --outline: oklch(.56 .02 var(--h)); --outline-v: oklch(.35 .02 var(--h));
  --scrim: oklch(.05 .01 var(--h) / .6);
  --inverse: oklch(.90 .01 var(--h)); --on-inverse: oklch(.22 .02 var(--h)); --inverse-primary: oklch(.50 .16 var(--h));
  --danger: oklch(.76 .14 27); --danger-c: oklch(.36 .09 27);
  --nL: .30; --nC: .05; --nPaper: .25;
  --shadow: 0 1px 2px oklch(0 0 0 / .4), 0 8px 22px oklch(0 0 0 / .35);
  color-scheme: dark;
}
:root[data-mode="light"]{ color-scheme: light; }

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden]{ display: none !important; }
:root{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body{ margin: 0; }
img{ max-width: 100%; }
html{ -webkit-text-size-adjust: 100%; }
html{ background: var(--bg); }
body{
  background: var(--bg); color: var(--fg);
  font: 400 15px/1.5 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
  -webkit-font-smoothing: antialiased;
}
body.locked{ overflow: hidden; }
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea{ font: inherit; color: inherit; }
:focus-visible{ outline: 3px solid var(--primary); outline-offset: 2px; }
.ms{
  font-family: "Material Symbols Rounded"; font-weight: 400; font-style: normal;
  font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  font-variation-settings: "FILL" 0; user-select: none; flex: none;
}
.ms.fill{ font-variation-settings: "FILL" 1; }

.wrap{ max-width: 760px; margin: 0 auto; }

/* ---------- Hero ---------- */
.hero{ position: relative; padding-top: 20px; padding-bottom: 8px; }
.hero-row{ display: flex; align-items: center; justify-content: space-between; height: 48px; position: relative; z-index: 2; }
.hero-row .icon-btn{ background: var(--s3); }
.eyebrow{ font: 700 12px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--primary); font-variation-settings: "wdth" 120; }
.display{
  margin: 18px 0 0; position: relative; z-index: 2;
  font-family: var(--f-ui); font-size: clamp(60px, 19vw, 104px); line-height: .86;
  font-weight: 860; font-variation-settings: "wdth" 130, "opsz" 144; letter-spacing: -.035em;
  color: var(--fg);
}
.display em{ font-style: normal; color: var(--primary); }
.hero-sub{ margin: 12px 0 0; color: var(--fg2); font-size: 15px; position: relative; z-index: 2; font-variation-settings: "wdth" 100; }
.hero-sub b{ color: var(--fg); font-weight: 650; }
.applique{ position: absolute; right: -4px; top: 30px; width: 132px; height: 132px; z-index: 1; pointer-events: none; }
.applique svg{ width: 100%; height: 100%; overflow: visible; }
.applique .spin{ transform-origin: 94px 46px; animation: spin 40s linear infinite; }
.applique .spin2{ transform-origin: 44px 104px; animation: spin 60s linear infinite reverse; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ---------- Search & filters ---------- */
.search{
  margin-top: 22px; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px;
  background: var(--s3); border-radius: 28px; color: var(--fg2);
  transition: border-radius .35s var(--e-fast), background .2s;
}
.search:focus-within{ border-radius: 18px; background: var(--s4); }
.search input{ flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px; color: var(--fg); }
.search input::placeholder{ color: var(--fg2); }
.search input::-webkit-search-cancel-button{ -webkit-appearance: none; }

.bgroup{ display: flex; gap: 2px; }
.bgroup > button{
  flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--s3); color: var(--fg); font-weight: 560; font-size: 14px; white-space: nowrap;
  border-radius: 8px; font-variation-settings: "wdth" 104;
  transition: border-radius .4s var(--e-fast), background .2s var(--e-effect), color .2s;
}
.bgroup > button:first-child{ border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
.bgroup > button:last-child{ border-top-right-radius: 20px; border-bottom-right-radius: 20px; }
.bgroup > button[aria-pressed="true"]{ background: var(--primary); color: var(--on-primary); border-radius: 20px; }
.bgroup > button:active{ border-radius: 12px; }
.bgroup .ms{ font-size: 18px; }
.filters{ margin-top: 14px; }

/* ---------- Cards ---------- */
.sec-label{ margin: 26px 4px 12px; font: 650 13px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.sec-label .ms{ font-size: 16px; }
.cols{ columns: 2 168px; column-gap: 12px; }
.card{
  break-inside: avoid; display: block; width: 100%; text-align: left; margin: 0 0 12px;
  padding: 14px 16px 14px; border-radius: 24px; background: var(--s2); color: var(--fg);
  position: relative; overflow: hidden;
  transition: transform .45s var(--e-fast), border-radius .45s var(--e-fast);
}
.card.tinted{ background: oklch(var(--nL) var(--nC) var(--nh)); }
.card:active{ transform: scale(.97); border-radius: 32px; }
.card-top{ display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.badge{ width: 30px; height: 30px; display: grid; place-items: center; position: relative; color: var(--on-primary-c); flex: none; }
.badge svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.badge svg path{ fill: var(--primary-c); }
.card.tinted .badge svg path{ fill: oklch(calc(var(--nL) + .06) calc(var(--nC) + .05) var(--nh)); }
.badge .ms{ position: relative; font-size: 17px; }
.chip-ex{ font: 600 11px/1 var(--f-ui); letter-spacing: .04em; padding: 5px 8px; border-radius: 10px; background: color-mix(in oklch, var(--fg) 9%, transparent); color: var(--fg2); }
.card h3{ margin: 0 0 4px; font-size: 17px; line-height: 1.25; font-weight: 680; font-variation-settings: "wdth" 108; text-wrap: balance; overflow-wrap: anywhere; }
.card.f-serif h3{ font-family: var(--f-serif); font-weight: 600; font-variation-settings: normal; }
.card.f-hand h3{ font-family: var(--f-hand); font-size: 23px; font-weight: 700; font-variation-settings: normal; line-height: 1.05; }
.card p{ margin: 0; color: var(--fg2); font-size: 14px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.card.f-hand p{ font-family: var(--f-hand); font-size: 19px; line-height: 1.2; }
.card.f-serif p{ font-family: var(--f-serif); }
.mini{ list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; }
.mini li{ display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.3; color: var(--fg); overflow-wrap: anywhere; min-width: 0; }
.card.f-hand .mini li{ font-family: var(--f-hand); font-size: 19px; line-height: 1.05; }
.mini .mb{ width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--fg2); flex: none; margin-top: 2px; display: grid; place-items: center; }
.mini li.d{ color: var(--fg2); text-decoration: line-through; }
.mini li.d .mb{ background: var(--primary); border-color: var(--primary); }
.mini li.d .mb svg{ width: 10px; height: 10px; stroke: var(--on-primary); stroke-width: 3.4; fill: none; }
.mini .more{ color: var(--fg2); font-size: 13px; padding-left: 22px; }
.thumb{ display: block; width: 100%; height: auto; border-radius: 16px; margin-top: 2px; background: var(--s1); }
.card-meta{ display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.prog{ display: inline-flex; align-items: center; gap: 6px; }
.prog i{ display: block; width: 34px; height: 4px; border-radius: 2px; background: color-mix(in oklch, var(--fg) 14%, transparent); overflow: hidden; }
.prog i b{ display: block; height: 100%; background: var(--primary); border-radius: 2px; }
.pin-dot{ color: var(--primary); }
.pin-dot .ms{ font-size: 18px; }

.empty{ text-align: center; padding: 48px 12px; color: var(--fg2); }
.empty svg{ width: 96px; height: 96px; margin: 0 auto 14px; display: block; }
.empty svg path{ fill: var(--tertiary-c); }
.empty strong{ display: block; color: var(--fg); font-size: 19px; font-weight: 680; margin-bottom: 4px; }

/* ---------- FAB menu ---------- */
.fab-wrap{
  position: fixed; z-index: 30;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
.fab{
  width: 80px; height: 80px; border-radius: 26px; background: var(--primary-c); color: var(--on-primary-c);
  display: grid; place-items: center; box-shadow: var(--shadow);
  transition: border-radius .5s var(--e-fast), transform .5s var(--e-fast), width .5s var(--e-fast), height .5s var(--e-fast), background .25s, color .25s;
}
.fab .ms{ font-size: 32px; transition: transform .5s var(--e-fast); }
.fab:active{ border-radius: 20px; transform: scale(.94); }
.fab[aria-expanded="true"]{ width: 56px; height: 56px; border-radius: 28px; background: var(--primary); color: var(--on-primary); margin-right: 12px; }
.fab[aria-expanded="true"] .ms{ transform: rotate(135deg); font-size: 26px; }
.fab-menu{ display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
.fab-menu button{
  height: 56px; padding: 0 22px 0 18px; border-radius: 28px; display: inline-flex; align-items: center; gap: 12px;
  background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 16px; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(20px) scale(.6); transform-origin: right center;
  transition: transform .45s var(--e-fast), opacity .18s var(--e-effect), border-radius .4s var(--e-fast);
}
.fab-menu button:active{ border-radius: 16px; }
.fab-wrap.open .fab-menu{ pointer-events: auto; }
.fab-wrap.open .fab-menu button{ opacity: 1; transform: none; }
.fab-wrap.open .fab-menu button:nth-child(3){ transition-delay: 0s; }
.fab-wrap.open .fab-menu button:nth-child(2){ transition-delay: .04s; }
.fab-wrap.open .fab-menu button:nth-child(1){ transition-delay: .08s; }
.fab-scrim{ position: fixed; inset: 0; z-index: 29; background: color-mix(in oklch, var(--bg) 70%, transparent); opacity: 0; pointer-events: none; transition: opacity .25s var(--e-effect); }
.fab-scrim.on{ opacity: 1; pointer-events: auto; }

/* ---------- Full-screen views ---------- */
.view{
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  transform: translateY(32px) scale(.98); opacity: 0;
  transition: transform .5s var(--e-spatial), opacity .22s var(--e-effect);
}
.view.open{ transform: none; opacity: 1; }
.ed-bar{
  height: 64px; flex: none; display: flex; align-items: center; gap: 4px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  max-width: 776px; width: 100%; margin: 0 auto;
}
.ed-bar .grow{ flex: 1; min-width: 0; }
.icon-btn{
  width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--fg); flex: none;
  transition: border-radius .4s var(--e-fast), background .2s;
}
.icon-btn:hover{ background: color-mix(in oklch, var(--fg) 7%, transparent); }
.icon-btn:active{ border-radius: 12px; background: color-mix(in oklch, var(--fg) 12%, transparent); }
.icon-btn[aria-pressed="true"]{ background: var(--secondary-c); color: var(--on-secondary-c); border-radius: 14px; }
.icon-btn[aria-pressed="true"] .ms{ font-variation-settings: "FILL" 1; }
.icon-btn:disabled{ opacity: .35; pointer-events: none; }
.icon-btn.sm{ width: 36px; height: 36px; }
.icon-btn.sm .ms{ font-size: 20px; }
.sync{ display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); padding: 6px 10px; border-radius: 12px; background: var(--s2); white-space: nowrap; }
.sync .ms{ font-size: 16px; }

.ed-scroll{
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(130px + env(safe-area-inset-bottom, 0px));
}
.page{
  --lh: 28px; --fs: 16.5px; --ff: var(--f-ui);
  max-width: 760px; margin: 0 auto; min-height: 70%;
  background: var(--s1); border-radius: 28px; padding: 22px 20px 26px;
  transition: background .3s var(--e-effect);
}
.page.tinted{ background: oklch(var(--nPaper) calc(var(--nC) * .5) var(--nh)); }
.page.f-serif{ --ff: var(--f-serif); --fs: 17px; }
.page.f-hand{ --ff: var(--f-hand); --fs: 23px; --lh: 30px; }
.ed-title{
  display: block; width: 100%; border: 0; background: transparent; outline: none; resize: none; overflow: hidden;
  font: 760 28px/1.15 var(--f-ui); font-variation-settings: "wdth" 112, "opsz" 32; letter-spacing: -.01em; color: var(--fg); padding: 0;
}
.page.f-serif .ed-title{ font-family: var(--f-serif); font-weight: 620; font-variation-settings: normal; }
.page.f-hand .ed-title{ font-family: var(--f-hand); font-weight: 700; font-size: 38px; line-height: 1; font-variation-settings: normal; }
.ed-title::placeholder, .ed-body::placeholder, .it-text::placeholder{ color: var(--fg2); opacity: .7; }
.ed-meta{ margin: 8px 0 14px; font-size: 12.5px; color: var(--fg2); display: flex; gap: 10px; flex-wrap: wrap; }
.ed-body{
  display: block; width: 100%; border: 0; outline: none; resize: none; overflow: hidden; padding: 0;
  min-height: calc(var(--lh) * 4);
  font: 400 var(--fs)/var(--lh) var(--ff); color: var(--fg);
  background-color: transparent; background-attachment: local;
}
.paper-lines{ background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--rule, color-mix(in oklch, var(--fg) 13%, transparent)) calc(var(--lh) - 1px)); background-size: 100% var(--lh); }
.paper-grid{ background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), color-mix(in oklch, var(--fg) 9%, transparent) calc(var(--lh) - 1px)), linear-gradient(to right, transparent calc(var(--lh) - 1px), color-mix(in oklch, var(--fg) 9%, transparent) calc(var(--lh) - 1px)); background-size: var(--lh) var(--lh); }
.paper-dots{ background-image: radial-gradient(circle at 1px 1px, color-mix(in oklch, var(--fg) 26%, transparent) 1.1px, transparent 1.6px); background-size: var(--lh) var(--lh); background-position: 0 calc(var(--lh) - 2px); }
.ed-body.paper-plain{ background-image: none; }

.list-head{ margin: 18px 0 6px; display: flex; align-items: center; gap: 10px; font: 650 12px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
.list-head .bar{ flex: 1; height: 6px; border-radius: 3px; background: color-mix(in oklch, var(--fg) 10%, transparent); overflow: hidden; }
.list-head .bar b{ display: block; height: 100%; width: 0; background: var(--primary); border-radius: 3px; transition: width .5s var(--e-spatial); }
.items{ display: grid; }
.item{ display: flex; align-items: flex-start; gap: 6px; min-height: var(--lh); padding: 4px 0; transition: opacity .3s var(--e-effect); }
.cbx{

/* ================= Formes M3 Expressive ================= */
function shapePath(kind, cx = 50, cy = 50, R = 50) {
  const cfg = { cookie: [9, .07], clover: [4, .2], sunny: [8, .045], flower: [6, .13], burst: [12, .09], circle: [0, 0], soft: [5, .09] }[kind] || [0, 0];
  const [n, amp] = cfg, N = 144, pts = [];
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2;
    let r = n ? 1 - amp + amp * Math.cos(n * t) : 1;
    if (kind === 'clover') r = 1 - amp + amp * Math.abs(Math.cos(n * t / 2)) ** .6;
    r *= R / (n ? 1 : 1);
    pts.push([cx + r * Math.cos(t - Math.PI / 2), cy + r * Math.sin(t - Math.PI / 2)]);
  }
  return 'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
}

  const d = new Path2D(shapePath(kind, 0, 0, R));
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.fill(d); ctx.restore();
}

/* ================= Synchro (si le viewer claude.ai la propose) ================= */
const R = { col: null, state: 'local', timers: {}, tooBig: false };
function setSync(state) {
  R.state = state;
  const el = $('#edSync');
  if (el) el.innerHTML = state === 'cloud'
    ? '<span class="ms">cloud_done</span>Synchronisé'
    : '<span class="ms">smartphone</span>Sur cet appareil';
}
function docOf(n) { const o = { ...n }; return JSON.parse(JSON.stringify(o)); }
function queueRemote(id) {
  if (!R.col) return;
  clearTimeout(R.timers[id]);
  R.timers[id] = setTimeout(() => {
    const n = S.notes[id];
    if (!n || !R.col) return;
    const data = docOf(n);
    if (JSON.stringify(data).length > 240000) {
      if (!R.tooBig) { R.tooBig = true; snack('Ce dessin est trop lourd pour la synchro : il reste enregistré sur cet appareil.'); }
      return;
    }
    R.col.doc(id).set(data).catch(() => {});
  }, 900);
}
function remoteDelete(id) { if (R.col) R.col.doc(id).delete().catch(() => {}); }
async function connectRemote() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const col = db.doc('data/users/' + uid + '/profile').collection('notes');
    let first = true;
    const timer = setTimeout(() => { if (first) setSync('local'); }, 10000);
    col.onSnapshot(snap => {
      clearTimeout(timer);
      R.col = col;
      const seen = new Set();
      let changed = false;
      snap.docs.forEach(d => {
        const data = d.data(); const id = d.id; seen.add(id);
        if (!data) return;
        if (S.tombs[id] && S.tombs[id] >= (data.updatedAt || 0)) { col.doc(id).delete().catch(() => {}); return; }
        const local = S.notes[id];
        if (!local || (data.updatedAt || 0) > local.updatedAt) {
          S.notes[id] = normalize({ ...data, id });
          changed = true;
          if (UI.cur === id) refreshOpenIfIdle();
        }
      });
      if (first) {
        Object.keys(S.notes).forEach(id => { if (!seen.has(id)) queueRemote(id); });
        first = false;
      }
      if (changed) { persist(); scheduleHome(); }
      setSync('cloud');
    }, () => { R.col = null; setSync('local'); });
  } catch { /* reste en local */ }
}

    sun.push(+(500 + r * Math.cos(t)).toFixed(1), +(470 + r * Math.sin(t)).toFixed(1), .6);
  }
  strokes.push({ t: 'hl', c: '#f0b429', s: 18, p: (() => { const p = []; for (let i = 0; i <= 40; i++) { const t = i / 40 * Math.PI * 2; p.push(+(500 + 100 * Math.cos(t)).toFixed(1), +(470 + 100 * Math.sin(t)).toFixed(1), .5); } return p; })() });
  strokes.push({ t: 'pen', c: '#e8742a', s: 9, p: sun });
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * Math.PI * 2;
    rays.push({ t: 'pen', c: '#b3261e', s: 7, p: [+(500 + 205 * Math.cos(a)).toFixed(1), +(470 + 205 * Math.sin(a)).toFixed(1), .4, +(500 + 270 * Math.cos(a)).toFixed(1), +(470 + 270 * Math.sin(a)).toFixed(1), .8] });

}

    head.push(c => {

      c.fillStyle = C.muted; c.font = F(700, 7.5, '"Roboto Flex", Helvetica, sans-serif');

      c.fillStyle = C.ink; c.font = F(bf.title[0], bf.title[1], bf.title[2]);
      tl.forEach((t, i) => c.fillText(t, L, 96 + i * tlh + bf.title[1] * .78));
      const yy = 96 + tl.length * tlh + 12;
      c.fillStyle = C.accent; c.fillRect(L, yy, 44, 1.6);
      c.fillStyle = C.muted; c.font = F(500, 9.5, '"Roboto Flex", Helvetica, sans-serif'); c.fillText(metaTxt, L + 54, yy + 3.5);
    });

  }

  /* ---- corps ---- */
  const pageH = cont ? 1e7 : A4.h, bottom = pageH - 60;

  let pg = pages[0], y = y0;

  const need = h => { if (y + h > bottom) newPage(); };
  meas.font = F(bf.w, bf.size, bf.fam);

  if (k === 'drawing' && n.drawing) {

    let w = CW, h = w * d.h / d.w;
    if (h > availH) { h = availH; w = h * d.w / d.h; }
    const x = L + (CW - w) / 2, yy = y;
    pg.ops.push(c => {

        pg.ops.push(c => { c.fillStyle = C.accent; c.font = F(700, 7.5, '"Roboto Flex", Helvetica, sans-serif'); spaced(c, lbl, L, yy + lh - 6, 1.3); }); }

            c.fillStyle = '#ffffff'; c.strokeStyle = C.accent; c.lineWidth = 1.2;
            c.beginPath(); c.roundRect ? c.roundRect(bx, by, box, box, 3) : c.rect(bx, by, box, box); c.fill(); c.stroke();

            c.fillStyle = C.accent; c.beginPath(); c.roundRect ? c.roundRect(bx, by, box, box, 3.5) : c.rect(bx, by, box, box); c.fill();

            c.fillText(line, L + ind, yy + lh - 5);
            if (strike && line) { const w = c.measureText(line).width; c.fillRect(L + ind, yy + lh - 5 - bf.size * .32, w, .8); }

    }
    if (!paras && !items.length) {
      const yy = y; pg.ops.push(c => { c.fillStyle = C.muted; c.font = F(400, 11, '"Roboto Flex", Helvetica, sans-serif'); c.fillText('Cette note est vide.', L, yy + lh - 5); });
      y += lh;

  /* ---- dessin des pages ---- */

  const total = pages.length;
  pages.forEach((p, i) => {
    const H = cont ? contH : A4.h;
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    const c = cv.getContext('2d'); c.scale(scale, scale); c.textBaseline = 'alphabetic';
    c.fillStyle = style === 'minimal' ? '#ffffff' : C.paper; c.fillRect(0, 0, W, H);
    if (style === 'carnet') {

      c.strokeStyle = C.accent; c.globalAlpha = .5; c.lineWidth = .9; c.beginPath(); c.moveTo(L - 14, 0); c.lineTo(L - 14, H); c.stroke(); c.globalAlpha = 1;

}

async function makePDF(n, o) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jspdf');
  const { pages, C, title } = await buildDoc(n, { ...o, scale: 2.4 });
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
  pages.forEach((p, i) => {
    if (i) doc.addPage();
    doc.addImage(p.canvas.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, A4.w, A4.h, 'pg' + i, 'FAST');
    if (o.inter && kindOf(n) !== 'drawing') p.boxes.forEach((b, j) => {
      const cb = new doc.AcroFormCheckBox();
      cb.fieldName = `case_${i + 1}_${j + 1}`;
      cb.x = b.x; cb.y = b.y; cb.width = b.s; cb.height = b.s;
      cb.color = C.accent;
      cb.appearanceState = b.done ? 'On' : 'Off';
      cb.value = b.done ? 'On' : 'Off';

  });

  return doc.output('blob');
}

function makeText(n, o) {

let dlCap;
const capDownloads = () => dlCap || (dlCap = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null));
async function deliver(blob, filename, mime, title) {
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title });
      return 'shared';
    }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  const dl = await capDownloads();
  if (dl) {
    try { const r = await dl.save({ filename, data: blob }); return r && r.status === 'delivered' ? 'shared' : 'saved'; }
    catch (e) { if (e && (e.code === 'declined')) return 'cancel'; if (e && e.code === 'rate_limited') return 'busy'; }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return 'saved';
  } catch { return 'fail'; }
}

        const data = JSON.stringify({ app: 'carnet-mxdukpe', version: 1, exportedAt: new Date().toISOString(), notes: Object.values(S.notes) });
        const d = new Date(), name = `carnet-sauvegarde-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
        const r = await deliver(new Blob([data], { type: 'application/json' }), name, 'application/json', 'Sauvegarde Carnet');
        $('#bkHint').textContent = r === 'saved' || r === 'shared' ? 'Sauvegarde prête.' : r === 'cancel' ? 'Export annulé.' : 'Export impossible depuis cette fenêtre.';
      }
    });
    body.addEventListener('input', e => { if (e.target.id === 'sig') { st.signature = e.target.value; persist(); } });
    body.addEventListener('change', async e => {
      if (e.target.id !== 'bkIn' || !e.target.files[0]) return;
      try {
        const j = JSON.parse(await e.target.files[0].text());
        const arr = Array.isArray(j) ? j : j.notes;
        if (!Array.isArray(arr)) throw 0;
        let c = 0;
        arr.forEach(x => { if (!x || !x.id) return; const ex = S.notes[x.id]; if (!ex || (x.updatedAt || 0) > ex.updatedAt) { S.notes[x.id] = normalize(x); delete S.tombs[x.id]; queueRemote(x.id); c++; } });
        persist(); renderHome();
        $('#bkHint').textContent = c ? `${c} note${c > 1 ? 's' : ''} importée${c > 1 ? 's' : ''}.` : 'Rien de nouveau dans ce fichier.';
      } catch { $('#bkHint').textContent = 'Ce fichier n’est pas une sauvegarde Carnet valide.'; }
      e.target.value = '';
    });
  });
}

/* ================= Snackbar ================= */
let snackT = 0, snackFn = null;
function snack(text, action, fn, ms = 5000) {
  const el = $('#snack'); clearTimeout(snackT);
  $('#snackText').textContent = text;
  const b = $('#snackAct'); b.hidden = !action; b.textContent = action || ''; snackFn = fn || null;
  el.hidden = false; requestAnimationFrame(() => el.classList.add('on'));
  snackT = setTimeout(hideSnack, ms);
}
function hideSnack() { const el = $('#snack'); el.classList.remove('on'); setTimeout(() => { if (!el.classList.contains('on')) el.hidden = true; }, 300); }

/* ================= Démarrage ================= */
function init() {
  const saved = lsRead();
  if (saved && saved.notes) {
    S.notes = {}; Object.values(saved.notes).forEach(n => { if (n && n.id) S.notes[n.id] = normalize(n); });
    S.tombs = saved.tombs || {}; S.settings = { ...DEFAULT_SETTINGS, ...(saved.settings || {}) };
  } else { seedExamples(); persist(); }
  applyTheme();
  renderHome();
  bindEditor(); bindDraw();

  $('#q').addEventListener('input', e => { UI.q = e.target.value.trim(); renderHome(); });
  $('#filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; UI.filter = b.dataset.f; $$('#filters [data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderHome(); });
  $('#list').addEventListener('click', e => { const c = e.target.closest('[data-open]'); if (c) open(c.dataset.open); });
  const fabWrap = $('#fabWrap'), fab = $('#fab'), scrimF = $('#fabScrim');
  const setFab = on => { fabWrap.classList.toggle('open', on); fab.setAttribute('aria-expanded', on); fab.setAttribute('aria-label', on ? 'Fermer' : 'Créer'); scrimF.classList.toggle('on', on); $$('#fabMenu button').forEach(b => b.tabIndex = on ? 0 : -1); };
  fab.onclick = () => setFab(fab.getAttribute('aria-expanded') !== 'true');
  scrimF.onclick = () => setFab(false);
  $('#fabMenu').addEventListener('click', e => { const b = e.target.closest('[data-new]'); if (!b) return; setFab(false); create(b.dataset.new); });
  $('#btnSettings').onclick = settingsSheet;
  $('#scrim').onclick = closeSheet;
  $('#snackAct').onclick = () => { const f = snackFn; snackFn = null; hideSnack(); if (f) f(); };
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#sheet').hidden) closeSheet();
    else if (fab.getAttribute('aria-expanded') === 'true') setFab(false);
    else if (openView) closeCurrent();
  });
  setSync('local');
  setInterval(() => { if (!openView) renderHome(); }, 60000);
  connectRemote();
}
init();
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
